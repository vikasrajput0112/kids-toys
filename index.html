<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kids Toys</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .products {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 220px;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .toy {
            font-size: 60px;
        }

        .price {
            color: #16a34a;
            font-weight: bold;
            font-size: 20px;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>🧸 Kids Toys</h1>
        <p>Fun Toys for Happy Kids</p>
    </header>

    <div class="container">

        <div class="products">

            <div class="card">
                <div class="toy">🧸</div>
                <h2>Teddy Bear</h2>
                <p>Soft and Cute Teddy Bear</p>
                <p class="price">₹499</p>
            </div>

            <div class="card">
                <div class="toy">🚗</div>
                <h2>Toy Car</h2>
                <p>Colorful Racing Car</p>
                <p class="price">₹299</p>
            </div>

            <div class="card">
                <div class="toy">🤖</div>
                <h2>Robot</h2>
                <p>Fun Interactive Robot</p>
                <p class="price">₹799</p>
            </div>

        </div>

        <footer>
            <p>Kids Toys © 2026</p>
        </footer>

    </div>

</body>

</html>
